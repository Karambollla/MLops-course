[pytest]
testpaths = tests labs/housing/tests
addopts = --import-mode=importlib
markers =
    sdk: requires MLOPS_RUN_SDK=1 and installed SDKs; uses only temporary local data
    integration: requires an explicitly enabled, already running external service
    writes: requires MLOPS_RUN_INTEGRATION=1 and MLOPS_RUN_WRITES=1; creates only isolated course resources
    gpu: requires compatible NVIDIA hardware
