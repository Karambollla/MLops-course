name: course-and-starter
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - run: python -m pip install -r labs/housing/requirements.txt
      - run: python -m pip install --no-deps -e labs/housing
      - run: make check
      - run: make test
      - run: make tasks-collect
